
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Interactive Photo Gallery</h1>
        <p>Explore beautiful photographs of nature.</p>
    </header>

    <main>
        <div id="image">
            Hover over or focus on an image below to display it here.
        </div>

        <div class="gallery">
            <img class="preview"
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                alt="Beautiful mountain landscape surrounded by nature">

            <img class="preview"
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
                alt="Peaceful lake surrounded by green mountains">

            <img class="preview"
                src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=600"
                alt="Wild animals living in their natural habitat">

            <img class="preview"
                src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
                alt="Sunlight shining through a green forest">

            <img class="preview"
                src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600"
                alt="Mountain lake under a clear blue sky">

            <img class="preview"
                src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600"
                alt="Tall mountain peaks beneath the sky">
        </div>
    </main>

    <footer>
        <p>Created for the Interactive Photo Gallery project.</p>
    </footer>
</body>
</html>
